[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-enricher"
version = "0.2.0"
description = "Local video understanding pipeline: structured metadata for recommenders."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.51.0",
    "accelerate",
    "bitsandbytes",
    "pydantic>=2.0.0",
    "numpy",
    "pillow",
    "av",
    "python-dotenv",
]

[project.optional-dependencies]
# Optional attention backend. Install only when the GPU stack supports it.
flash-attn = ["flash-attn"]
# Optional Cursor SDK for the alternative Grok evaluator. Codex uses the installed CLI.
evaluation = ["cursor-sdk"]

[project.scripts]
open-enricher = "open_enricher.experiments.loop:main"
open-enricher-eval = "open_enricher.evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=local-archive"

[tool.setuptools.package-data]
open_enricher = ["*.json", "*.md"]
"open_enricher.stages" = ["pipeline_spec.json", "prompts/*.md"]
"open_enricher.stages.vlm_core" = ["*.json"]
"open_enricher.evaluation" = ["prompts/*.md"]
"open_enricher.experiments" = ["variants/*.json"]
